<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/about.css">
  <title>Rock, Paper, Sicsoors</title>
  <body>
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
  
<!-- bot score-->
<div class="alert alert-warning alert-dismissible fade show" role="alert">
  <strong>Info and Rules:</strong> This is rock, paper, sicsoors! rock beats scisoors, scissors beats paper, paper beats rock. If you want to reset, hit the rest button below. Have fun! :D
  <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>

<!-- player score-->
  <div class="playerheader">
    <div class="row">
    <div class="col-8">
      
    <h1 style="text-align: center;"> Yu Score</h1>
<h2 style="text-align: center;">number</h2>
</div>
</div>
</div>
<!-- bot score-->
<div class="botheader">

    <div class="col-8">
    <h1> Bot Score</h1>
<h2 style="text-align: center;">number</h2>
</div>
</div>
</div>

  <div class="col-8">

  <div class="col-7">
<h3 style="text-align: center;">
  My Choice:
    Computer Choice:
    You (blank)!
